# Builds Polaris Navdata for Windows (PolarisNavdata.exe) whenever its files change on main, or by hand
# (Actions > Build Polaris Navdata > Run workflow).
# From main, the .exe goes on the repository's "navdata" release (replacing the one before), so
# https://github.com/KOZ8738/home/releases/download/navdata/PolarisNavdata.exe is always the newest build: the EFB's
# App Store links it. Each run also keeps it as an artifact for 90 days.
name: Build Polaris Navdata

on:
  push:
    branches: [main]
    paths:
      - 'tools/polaris-navdata/**'
      - '.github/workflows/build-navdata.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-navdata
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: tools/polaris-navdata
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Test (MSFS's procedures and live values, X-Plane 12 against a stand-in for its Web API, its own life)
        run: npm test
      - name: Build PolarisNavdata.exe
        run: npm run build
      - name: Test the .exe itself
        run: node test_xplane.js && node test_life.js
        env:
          NAVDATA_EXE: dist/PolarisNavdata.exe
      # the .exe, started above, set up the polaris-navdata: link the EFB starts it with
      - name: Check the polaris-navdata link
        shell: pwsh
        run: |
          $k = 'HKCU:\Software\Classes\polaris-navdata'
          $cmd = (Get-ItemProperty "$k\shell\open\command").'(default)'
          $want = '"' + (Resolve-Path 'dist\PolarisNavdata.exe').Path + '" --from-link "%1"'
          Write-Output "polaris-navdata: opens $cmd"
          if ($cmd -ne $want) { throw "the link opens '$cmd', not '$want'" }
          if ((Get-ItemProperty $k).'URL Protocol' -ne '') { throw 'the link is not marked as a URL protocol' }
      - name: Version
        id: v
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: PolarisNavdata-${{ steps.v.outputs.v }}
          path: tools/polaris-navdata/dist/PolarisNavdata.exe
          if-no-files-found: error
          retention-days: 90
      # the "navdata" tag moves to this commit; the release keeps its name, with this version in its title
      - name: Publish to the navdata release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.v }}
        run: |
          notes="Polaris Navdata $V for the Polaris EFB, built from ${GITHUB_SHA::7}. Windows: download PolarisNavdata.exe and open it once on the simulator PC; from then on the EFB there starts it, and it closes by itself 10 minutes after the EFB. SIDs, STARs and approaches, the Backup PFD, the landing rate, GSX and the block times from MSFS 2020/2024 (SimConnect, no FSUIPC needed) or X-Plane 12.1.1 and later."
          git tag -f navdata "$GITHUB_SHA" && git push -f origin refs/tags/navdata
          if gh release view navdata >/dev/null 2>&1; then
            gh release edit navdata --title "Polaris Navdata $V" --notes "$notes" --latest=false
          else
            gh release create navdata --title "Polaris Navdata $V" --notes "$notes" --latest=false
          fi
          gh release upload navdata dist/PolarisNavdata.exe --clobber
