# Builds Polaris Navdata for Windows (PolarisNavdata.exe) whenever its files change on main, or by hand
# (Actions > Build Polaris Navdata > Run workflow).
# From main, the .exe goes on the repository's "navdata" release (replacing the one before), so
# https://github.com/KOZ8738/home/releases/download/navdata/PolarisNavdata.exe is always the newest build: the EFB's
# App Store links it. Each run also keeps it as an artifact for 90 days.
name: Build Polaris Navdata

on:
  push:
    branches: [main]
    paths:
      - 'tools/polaris-navdata/**'
      - '.github/workflows/build-navdata.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-navdata
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: tools/polaris-navdata
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Test (the MSFS reader, and X-Plane 12 against a stand-in for its Web API)
        run: npm test
      - name: Build PolarisNavdata.exe
        run: npm run build
      - name: Test the .exe itself
        run: node test_xplane.js
        env:
          NAVDATA_EXE: dist/PolarisNavdata.exe
      - name: Version
        id: v
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: PolarisNavdata-${{ steps.v.outputs.v }}
          path: tools/polaris-navdata/dist/PolarisNavdata.exe
          if-no-files-found: error
          retention-days: 90
      # the "navdata" tag moves to this commit; the release keeps its name, with this version in its title
      - name: Publish to the navdata release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.v }}
        run: |
          notes="Polaris Navdata $V for the Polaris EFB, built from ${GITHUB_SHA::7}. Windows: download PolarisNavdata.exe, open it on the simulator PC and keep its window open. SIDs, STARs and approaches from MSFS or X-Plane 12; with X-Plane 12.1.1 or later also the Backup PFD, the landing rate and the block times."
          git tag -f navdata "$GITHUB_SHA" && git push -f origin refs/tags/navdata
          if gh release view navdata >/dev/null 2>&1; then
            gh release edit navdata --title "Polaris Navdata $V" --notes "$notes" --latest=false
          else
            gh release create navdata --title "Polaris Navdata $V" --notes "$notes" --latest=false
          fi
          gh release upload navdata dist/PolarisNavdata.exe --clobber
