# Temporary: fetches eAIP pages from a GitHub runner so their raw HTML can be studied (branch deleted after use)
name: eAIP probe
on:
  push:
    branches: [claude/eaip-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: main, path: mainsrc }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node probe/fetch.mjs || true
      - uses: actions/checkout@v4
        with: { ref: 16d401ea82b1ea67a89c7d9ef9a5e1488bc74cc8, path: base }
      - run: node probe/ea.mjs || true
      - run: EA_SRC=base OUT=_ea_base.json node probe/ea.mjs || true
      - name: keep the results on this branch
        run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add -f probe/out && git commit -qm "probe results [skip ci]" && git push -q origin HEAD:claude/eaip-probe
