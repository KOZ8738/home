            <li style="--i:0"><a class="title-1" href="index.html">主頁</a></li>
            <li style="--i:1"><a class="title-1" href="game.html">遊戲庫</a></li>

        </ul>
    </nav>
    <!-- /shared:header -->

    <main class="page-main" id="main">
        <div class="flights-wrap">

            <!-- 飛過的航線世界地圖 -->
            <section class="world-card" id="worldCard" aria-label="飛過的航線地圖" hidden>
                <div class="world-map" id="worldMap" role="img" aria-label="地圖，標出飛過的機場和航線，點機場可以篩選航班"></div>
                <p class="world-badge caption-1" id="worldStat"></p>
            </section>

            <div class="flights-head">
                <div>
                    <h1 class="heading-4 md-heading-3">航班</h1>
                    <p class="page-sub body-3" id="flightsSub">連線飛行時顯示即時位置，沒有連線時顯示歷史航班。</p>
                </div>
                <div class="flights-actions">
                    <span class="status-badge" id="statusBadge" hidden>
                        <span class="status-dot" aria-hidden="true"></span>
                        <span class="caption-1" id="statusText"></span>
                    </span>
                </div>
            </div>

            <!-- 讀取即時資料失敗時的提示 -->
            <div id="notice"></div>

            <!-- 讀取中：和內容同樣大小的骨架 -->
            <section id="loadingSection" aria-label="讀取中">
                <div class="skeleton-row">
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                </div>
            </section>

            <!-- 在線：即時位置 -->
            <section id="liveSection" aria-label="即時位置" hidden>
                <div class="live-head">
                    <p class="caption-1 live-kicker">目前飛行中</p>
                    <h2 class="heading-5" id="liveCallsign"></h2>
                    <p class="body-3" id="liveRoute"></p>
                    <p class="caption-2 muted" id="liveMeta"></p>
                </div>

                <div class="stat-grid">
                    <div class="stat-tile">
                        <p class="stat-label caption-1"><i class="ph ph-mountains" aria-hidden="true"></i>高度</p>
                        <p class="heading-5" id="statAlt"></p>
                    </div>
                    <div class="stat-tile">
                        <p class="stat-label caption-1"><i class="ph ph-gauge" aria-hidden="true"></i>地速</p>
                        <p class="heading-5" id="statSpeed"></p>
                    </div>
                    <div class="stat-tile">
                        <p class="stat-label caption-1"><i class="ph ph-compass" aria-hidden="true"></i>航向</p>
                        <p class="heading-5" id="statHeading"></p>
                    </div>
                    <div class="stat-tile">
                        <p class="stat-label caption-1"><i class="ph ph-map-pin" aria-hidden="true"></i>位置</p>
                        <p class="heading-5" id="statPos"></p>
                        <p class="caption-2 muted stat-sub" id="statPosSub" hidden></p>
                    </div>
                </div>

                <div class="map-card" id="mapCard">
                    <div id="map" role="img" aria-label="飛機目前位置的地圖"></div>
                </div>
                <p class="caption-2 muted" id="trailNote" hidden>實線是這個瀏覽器記錄到的軌跡，虛線是依起降機場推估的航線（頁面開啟前飛過的部分沒有真實紀錄）。</p>
            </section>

            <!-- 不在線：歷史航班 -->
            <section id="historySection" aria-label="歷史航班" hidden>
                <div class="summary-grid" id="summary"></div>

                <form class="filter-bar" id="filterBar" role="search" aria-label="篩選航班" hidden>
                    <div class="filter-search">
                        <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
                        <input class="body-2" type="search" id="fSearch" placeholder="搜尋呼號、機場、機型、註冊號、航班編號或日期" aria-label="搜尋航班" autocomplete="off">
                    </div>
                    <div class="filter-grid" id="filterSelects"></div>
                    <div class="filter-segs" id="filterSegs"></div>
                    <div class="filter-foot">
                        <p class="caption-1 muted" id="filterCount" aria-live="polite"></p>
                        <button class="btn btn-on-light button-sm" type="button" id="filterClear">清除篩選</button>
                    </div>
                </form>

                <div class="flight-list" id="flightList"></div>
            </section>

        </div>
    </main>

    <div class="flight-modal" id="flightModal" role="dialog" aria-modal="true" aria-labelledby="fmTitle">
        <button class="lb-btn lb-close" id="fmClose" type="button" aria-label="關閉"><i class="ph ph-x" aria-hidden="true"></i></button>
        <div class="fm-card" id="fmCard" tabindex="-1"></div>
