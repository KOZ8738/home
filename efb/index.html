<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Polaris Airways EFB</title>
<meta name="theme-color" content="#1A6772">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Polaris EFB">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="efb-build" content="1113.1855">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<meta name="robots" content="noindex,nofollow">
</head><body>
<style>
/* Layout: an iPad running iPadOS — wallpaper, widgets, labelled app icons, page dots and dock; apps zoom open full screen in the airline EFB style (dark app bar, flat panels, cockpit colours). On desktop the screen sits inside an iPad bezel with a working Home button. */
:root{
  /* Polaris website tokens (light), plus cockpit status colours */
  --bg:#F3F7F7; --panel:#FFFFFF; --panel-2:#F3F7F7; --line:#CCD7D7; --ink:#0F2A2E; --label:#51696C; --grid:#E3E9E9; --shadow:rgba(26,103,114,.35);
  --bar:#1A6772; --bar-ink:#FFFFFF; --bar-label:#E3E9E9; --bar-line:#2B7580;
  --brand:#1A6772; --brand-ink:#FFFFFF; --accent:#1A6772; --accent-h:#1A6772; --bronze:#A78970; --bronze-soft:#C9B39F; --mist:#E3E9E9;
  --cyan:#0A6E87; --green:#2C7A4B; --amber:#A4620A; --red:#B42828; --magenta:#8E2A8B; --input:#FFFFFF;
  /* iPadOS shell */
  --wp0:#E7EEEE; --wp1:#1A6772; --wp2:#5AA3AD; --wp3:#E8D9CA; --wp4:#A78970; --wp5:#F7FAFA;
  --wg:#FFFFFF; --wg-ink:#000000; --wg-sub:#8A8A8E; --wg-line:rgba(60,60,67,.16);
  --wx-a:#2F78D0; --wx-b:#6FAFEA; --dockbg:rgba(255,255,255,.36); --dockline:rgba(255,255,255,.55); --desk:#D3D9DA;
  --f-ui:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-disp:"Marcellus","Optima","Palatino Linotype",Georgia,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --f-os:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --sbh:0px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121213; --panel:#1A1A1C; --panel-2:#222225; --line:#2E2E32; --ink:#E8E8E9; --label:#9C9CA1; --grid:#232326; --shadow:rgba(0,0,0,.6);
  --bar:#0B0B0C; --bar-ink:#E8E8E9; --bar-label:#9C9CA1; --bar-line:#2E2E32;
  --brand:#1A6772; --brand-ink:#FFFFFF; --accent:#7CC2C9; --accent-h:#E8E8E9; --bronze:#C3A487; --bronze-soft:#C9B39F; --mist:#E3E9E9;
  --cyan:#5CC6E0; --green:#4FC27E; --amber:#EBA537; --red:#F06A6A; --magenta:#D87BD8; --input:#161618;
  --wp0:#061012; --wp1:#0D3B42; --wp2:#1C545C; --wp3:#3A3128; --wp4:#5A4838; --wp5:#12262A;
  --wg:#1C1C1E; --wg-ink:#FFFFFF; --wg-sub:#98989F; --wg-line:rgba(255,255,255,.14);
  --wx-a:#11264A; --wx-b:#2C5488; --dockbg:rgba(38,38,40,.45); --dockline:rgba(255,255,255,.2); --desk:#050707; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121213; --panel:#1A1A1C; --panel-2:#222225; --line:#2E2E32; --ink:#E8E8E9; --label:#9C9CA1; --grid:#232326; --shadow:rgba(0,0,0,.6);
  --bar:#0B0B0C; --bar-ink:#E8E8E9; --bar-label:#9C9CA1; --bar-line:#2E2E32;
  --brand:#1A6772; --brand-ink:#FFFFFF; --accent:#7CC2C9; --accent-h:#E8E8E9; --bronze:#C3A487; --bronze-soft:#C9B39F; --mist:#E3E9E9;
  --cyan:#5CC6E0; --green:#4FC27E; --amber:#EBA537; --red:#F06A6A; --magenta:#D87BD8; --input:#161618;
  --wp0:#061012; --wp1:#0D3B42; --wp2:#1C545C; --wp3:#3A3128; --wp4:#5A4838; --wp5:#12262A;
  --wg:#1C1C1E; --wg-ink:#FFFFFF; --wg-sub:#98989F; --wg-line:rgba(255,255,255,.14);
  --wx-a:#11264A; --wx-b:#2C5488; --dockbg:rgba(38,38,40,.45); --dockline:rgba(255,255,255,.2); --desk:#050707; color-scheme:dark}

html,body{height:100%}
body{background:var(--sbg,var(--wp0));color:var(--ink);font-family:var(--f-ui);font-size:13.5px;line-height:1.4;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sbg,var(--wp0))}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.c-green{color:var(--green)!important} .c-amber{color:var(--amber)!important} .c-red{color:var(--red)!important} .c-cyan{color:var(--cyan)!important} .c-mag{color:var(--magenta)!important} .c-label{color:var(--label)!important}

/* ---------- device ---------- */
.desk,.ipad{height:100%}
.screen{position:relative;width:100%;height:100%;overflow:hidden;container-type:size;container-name:screen;background:var(--wp0)}
.cam,.homebutton{display:none}
@media (pointer:fine) and (min-width:1100px) and (min-height:760px){
  body{background:var(--desk)}
  body::before{background:var(--desk)}
  .desk{display:grid;place-items:center;padding:24px}
  .ipad{height:auto;position:relative;padding:30px 72px;background:#1C1E20;border-radius:46px;box-shadow:0 0 0 2px #3A3D41,0 0 0 3px #111,0 30px 70px rgba(0,0,0,.35)}
  .screen{width:min(1180px,calc(100vw - 200px),calc((100vh - 110px) * 4 / 3));height:auto;aspect-ratio:4/3;border-radius:6px}
  .cam{display:block;position:absolute;left:32px;top:50%;width:9px;height:9px;margin-top:-4px;border-radius:50%;background:#2B3034;box-shadow:inset 0 0 0 2px #23272A}
  .homebutton{display:block;position:absolute;right:16px;top:50%;width:42px;height:42px;margin-top:-21px;border-radius:50%;border:2px solid #3E4246;background:#17191B;cursor:pointer}
  .homebutton:active{background:#0E0F10}
  .homeind{display:none!important}
  .screen{--sbh:26px}
  .statusbar{display:flex!important}
}

/* status bar */
.statusbar{position:absolute;inset:0 0 auto;height:var(--sbh);z-index:6;display:flex;align-items:center;justify-content:space-between;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));color:#fff;font:600 13px/1 var(--f-os);pointer-events:none}
.statusbar span{display:flex;align-items:center;gap:7px}
.statusbar .date{font-weight:500}
.statusbar svg{height:12px;fill:#fff}
.screen.in-app .statusbar{color:var(--bar-ink)}
.statusbar{display:none}

/* ---------- home screen ---------- */
.home{position:absolute;inset:0;padding-top:var(--sbh);display:grid;grid-template-rows:minmax(0,1fr) auto auto;--ic:clamp(54px,6.3cqw,72px);font-family:var(--f-os)}
.wallpaper{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.home>*:not(.wallpaper){position:relative;z-index:1}
.pages{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;min-height:0}
.pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;min-width:0;overflow-y:auto;scroll-snap-align:start;scrollbar-width:none;padding-block:max(18px,3.4cqh) 12px;padding-left:max(16px,env(safe-area-inset-left,0px),5cqw);padding-right:max(16px,env(safe-area-inset-right,0px),5cqw)}
.p1{display:grid;grid-template-columns:min(340px,35cqw) minmax(0,1fr);gap:5.5cqw;align-items:start}
.widgets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.6cqw,18px)}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:clamp(18px,3.4cqh,30px) 6px;justify-items:center;align-content:start}
@container screen (max-width:720px){.p1{grid-template-columns:1fr;gap:24px}.p1 .apps{order:-1}.apps{grid-template-columns:repeat(4,minmax(0,1fr))}}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;width:100%;max-width:104px;-webkit-tap-highlight-color:transparent}
.icon{position:relative;width:var(--ic);height:var(--ic);border-radius:22.5%;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.16),inset 0 0 0 .5px rgba(0,0,0,.08);flex:none}
.icon svg{width:58%;height:58%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.app:active .icon{filter:brightness(.78)}
.lbl{color:#fff;font:500 12px/1.2 var(--f-os);text-shadow:0 1px 3px rgba(0,0,0,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.badge{position:absolute;top:-6px;right:-7px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#FF3B30;color:#fff;font:600 13px/22px var(--f-os);text-align:center}
.dots{display:flex;justify-content:center;gap:9px;padding:4px 0 8px}
.dots button{width:7px;height:7px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.45);cursor:pointer}
.dots button[aria-current="true"]{background:#fff}
.dockwrap{display:flex;justify-content:center;padding:0 16px max(12px,1.6cqh)}
.dock{display:flex;align-items:center;gap:clamp(10px,1.4cqw,16px);padding:11px 13px;border-radius:26px;background:var(--dockbg);-webkit-backdrop-filter:blur(26px) saturate(1.7);backdrop-filter:blur(26px) saturate(1.7);border:.5px solid var(--dockline);max-width:100%}
.dock .app{width:auto}
.dock .sep{width:1px;align-self:stretch;margin:4px 2px;background:var(--dockline)}
@container screen (max-width:560px){.dock .recent,.dock .sep{display:none}.home{--ic:56px}}

/* widgets */
.w{background:var(--wg);color:var(--wg-ink);border-radius:20px;padding:14px;font-family:var(--f-os);text-decoration:none;display:flex;flex-direction:column;min-width:0;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.w-s{aspect-ratio:1}
.w-m{grid-column:span 2;aspect-ratio:2.12}
.w-l{grid-column:span 2;aspect-ratio:1.5}
.w-clock{padding:9px;align-items:center;justify-content:center}
.w-clock svg{width:100%;height:100%}
.rem-top{display:flex;justify-content:space-between;align-items:flex-start}
.rem-ic{width:28px;height:28px;border-radius:50%;background:#34C759;display:grid;place-items:center}
.rem-ic svg{width:15px;height:15px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.rem-n{font-size:26px;font-weight:700;line-height:1}
.rem-t{color:#34C759;font-weight:600;font-size:14px;margin:6px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rem-l{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;font-size:12px}
.rem-l li{display:flex;align-items:center;gap:7px;padding:4px 0;border-bottom:.5px solid var(--wg-line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rem-l li:last-child{border-bottom:0}
.rem-l i{width:12px;height:12px;flex:none;border-radius:50%;border:1.5px solid var(--wg-sub)}
.w-cal{flex-direction:row;gap:14px}
.cal-l{width:32%;display:flex;flex-direction:column;min-width:0}
.cal-d{color:#FF3B30;font-weight:700;font-size:11px;letter-spacing:.04em}
.cal-n{font-size:46px;font-weight:300;line-height:1.05}
.cal-due{margin-top:auto;font-size:12px;color:var(--wg-sub);font-weight:500}
.cal-r{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0}
.ev{background:color-mix(in srgb,var(--brand) 13%,transparent);border-left:3px solid var(--brand);border-radius:5px;padding:6px 9px;display:flex;flex-direction:column;gap:1px;min-width:0}
.ev b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev span{font-size:11.5px;color:var(--wg-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.alt{background:color-mix(in srgb,var(--bronze) 15%,transparent);border-left-color:var(--bronze)}
.ex{font-size:10px;font-weight:700;letter-spacing:.06em;color:#FF9500;margin-left:6px}
.w-wx{background:linear-gradient(180deg,var(--wx-b),var(--wx-a));color:#fff;gap:10px}
.wx-top{display:flex;justify-content:space-between;gap:10px}
.wx-loc{font-size:15px;font-weight:600;display:block}
.wx-role{font-size:11px;opacity:.8;display:block}
.wx-temp{font-size:40px;font-weight:300;line-height:1.05;display:block}
.wx-cond{text-align:right;font-size:12px;display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.wx-cond b{font-size:13px;font-weight:600}
.wx-rows{margin-top:auto;display:flex;flex-direction:column;border-top:.5px solid rgba(255,255,255,.35)}
.wx-row{display:grid;grid-template-columns:40px 46px 1fr auto;gap:8px;align-items:center;padding:5px 0;font-size:12px;border-bottom:.5px solid rgba(255,255,255,.2)}
.wx-row:last-child{border-bottom:0}
.wx-row .r{opacity:.75;font-size:11px}
.wx-row .c{display:flex;align-items:center;gap:6px;font-weight:600}
.wx-row .c i{width:8px;height:8px;border-radius:50%}
.wx-row .w2{font-family:var(--f-mono);font-size:11.5px;opacity:.9}

/* ---------- app window (Polaris website design language: Marcellus titles, Jost text, Plex Mono data, white cards, teal headers, bronze eyebrows) ---------- */
.appwin{position:absolute;inset:0;z-index:4;display:grid;grid-template-rows:var(--sbh) auto minmax(0,1fr) auto;background:var(--bg);font-family:var(--f-ui)}
.appwin .sbspace{background:var(--bar)}
.appwin.opening{animation:zin .34s cubic-bezier(.2,.85,.25,1)}
.appwin.closing{animation:zout .26s cubic-bezier(.4,0,.85,.4) forwards}
@keyframes zin{from{transform:scale(.08);opacity:0;border-radius:60px}to{transform:none;opacity:1}}
@keyframes zout{from{transform:none;opacity:1}to{transform:scale(.08);opacity:0;border-radius:60px}}
.nav{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:18px;min-height:64px;background:var(--panel);border-bottom:1px solid var(--line);padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.nav-back{display:inline-flex;align-items:center;gap:2px;color:var(--accent);text-decoration:none;font:500 15px/1 var(--f-ui);padding:8px 8px 8px 2px;border-radius:2px}
.nav-back svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nav-back:hover{color:var(--bronze)}
.nav-title{display:flex;align-items:center;gap:12px;min-width:0}
.nav-ic{width:34px;height:34px;border-radius:22.5%;display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12)}
.nav-ic svg{width:60%;height:60%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-title>div{min-width:0;display:flex;flex-direction:column;gap:3px}
.nav-title h1{font:400 22px/1.05 var(--f-disp);color:var(--accent-h);margin:0;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eyebrow{font:500 10.5px/1.1 var(--f-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--bronze);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-tools{display:flex;align-items:center;gap:8px;justify-self:end}
.nav-r{display:flex;align-items:center;gap:12px;justify-self:end}
.clock{font:500 14px/1 var(--f-mono);letter-spacing:.02em;white-space:nowrap;color:var(--ink);font-variant-numeric:tabular-nums}
.clock small{font:500 10px/1 var(--f-ui);color:var(--label);margin-right:6px;letter-spacing:.16em}
.wake{font:500 10px/1 var(--f-mono);color:var(--green);border:1px solid var(--green);padding:3px 6px;border-radius:999px}
.theme-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer}
.theme-btn svg{width:19px;height:19px}
.theme-btn:hover{border-color:var(--accent);color:var(--accent)}
:root[data-theme="dark"] .theme-btn .glow{opacity:0}
@container screen (max-width:860px){.nav-tools .hide-n{display:none}}
@container screen (max-width:700px){.nav{grid-template-columns:minmax(0,1fr) auto;row-gap:8px;padding-block:8px}.nav-tools{grid-column:1/-1;grid-row:2;justify-self:stretch;overflow-x:auto}.nav .clock{display:none}.nav-ic{display:none}}
main{overflow-y:auto;min-height:0;padding-block:22px 36px;padding-left:max(18px,env(safe-area-inset-left,0px),2.4cqw);padding-right:max(18px,env(safe-area-inset-right,0px),2.4cqw)}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.screen[data-layout="split"] main,.screen[data-layout="full"] main{padding:0;overflow:hidden}
.screen[data-layout="split"] .wrap,.screen[data-layout="full"] .wrap{max-width:none;height:100%;display:block}
.homeind{display:flex;justify-content:center;align-items:center;height:20px;border:0;background:var(--bg);cursor:pointer;width:100%;touch-action:none}
.homeind span{width:140px;height:5px;border-radius:3px;background:var(--ink);opacity:.45}
.homeind:hover span{opacity:.8}

/* split view: sidebar + detail, like an iPad app */
.split{display:grid;grid-template-columns:min(310px,32cqw) minmax(0,1fr);height:100%}
.side{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;min-height:0;display:flex;flex-direction:column}
.detail{overflow-y:auto;min-height:0;padding:24px max(18px,2.4cqw) 40px}
.detail>.dwrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.side-h{padding:18px 18px 10px}
.side-h h2{font:400 26px/1.1 var(--f-disp);color:var(--accent-h);margin:6px 0 0}
.side-h p{margin:6px 0 0;color:var(--label);font-size:13px}
.slabel{padding:16px 18px 6px;font:500 10.5px/1 var(--f-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--bronze)}
.snav{display:flex;flex-direction:column;padding:0 10px}
.snav button,.snav a{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;border-radius:3px;background:transparent;text-align:left;cursor:pointer;color:var(--ink);text-decoration:none;font:500 14.5px/1.25 var(--f-ui);position:relative}
.snav button:hover,.snav a:hover{background:var(--panel-2)}
.snav [aria-pressed="true"],.snav [aria-current="page"]{background:color-mix(in srgb,var(--brand) 10%,var(--panel));color:var(--accent)}
.snav [aria-pressed="true"]::before,.snav [aria-current="page"]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--brand)}
.snav .si{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;background:var(--panel-2);color:var(--accent)}
.snav .si svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.snav .sm{font:500 12px/1 var(--f-mono);color:var(--label);white-space:nowrap}
.snav .st{display:flex;flex-direction:column;gap:2px;min-width:0}
.snav .st small{font:400 12px/1.3 var(--f-ui);color:var(--label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .sfoot{margin-top:auto;padding:14px 18px;font-size:12px;color:var(--label);border-top:1px solid var(--line)}
.side .sx{padding:0 18px 14px}
@container screen (max-width:760px){
  .screen[data-layout="split"] main{overflow-y:auto}
  .split{grid-template-columns:minmax(0,1fr);height:auto}
  .ticket{margin:12px 16px 4px}
  .side{border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  .side .side-x,.side .sfoot,.side .slabel{display:none}
  .snav{flex-direction:row;overflow-x:auto;gap:4px;padding:8px 10px}
  .snav button,.snav a{width:auto;flex:none;grid-template-columns:auto auto;padding:8px 12px}
  .snav .sm{display:none}.snav .st small{display:none}
  .snav [aria-pressed="true"]::before{left:10px;right:10px;top:auto;bottom:2px;width:auto;height:2px}
  .detail{overflow:visible;padding:18px 16px 32px}
}

/* tabs and segmented controls (website .tabs) */
.seg{display:inline-flex;gap:2px;background:color-mix(in srgb,var(--brand) 8%,var(--panel));padding:3px;border-radius:3px;flex:none}
.seg button{border:0;background:transparent;color:var(--label);padding:8px 13px;border-radius:2px;cursor:pointer;font:500 12.5px/1 var(--f-ui);letter-spacing:.04em;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}

/* cards */
.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;min-width:0;overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);font:500 10.5px/1.2 var(--f-ui);letter-spacing:.18em;text-transform:uppercase;color:var(--label)}
.ph b{color:var(--ink);font:500 12.5px/1 var(--f-mono);letter-spacing:.02em;text-transform:none}
.card-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 20px 14px;border-bottom:1px solid var(--line)}
.card-h h3{font:400 21px/1.15 var(--f-disp);margin:5px 0 0;color:var(--ink)}
.card-h .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card.feat>.card-h{background:var(--brand);color:#fff;border-bottom:0}
.card.feat>.card-h h3{color:#fff}
.card.feat>.card-h .eyebrow{color:var(--mist);opacity:.85}
.card.feat>.card-h .tagl{font:500 11px/1 var(--f-mono);letter-spacing:.08em;color:var(--mist)}
.card-b{padding:16px 20px}
.card-f{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 20px;background:var(--panel-2);border-top:1px solid var(--line);font-size:13px;color:var(--label)}
.pb{padding:14px 16px}
.cells,.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));margin:0 -1px -1px 0}
.cell,.stats>div{padding:14px 18px;display:flex;flex-direction:column;gap:7px;min-width:0;box-shadow:inset -1px 0 0 var(--line),inset 0 -1px 0 var(--line)}
.cell .k,.stats dt{font:500 10.5px/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--label)}
.cell .v,.stats dd{margin:0;font:500 17px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere;color:var(--ink)}
.cell .v small,.stats dd small{font:400 11.5px var(--f-ui);color:var(--label)}
.cells.big .v,.stats.big dd{font:400 30px/1.05 var(--f-disp)}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.note{font-size:13px;color:var(--label);line-height:1.5;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:2px;padding:10px 16px;font:500 13.5px/1 var(--f-ui);letter-spacing:.04em;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:#155760;color:#fff}
.btn.brz{background:var(--bronze);border-color:var(--bronze);color:#fff}
.btn.warn{color:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{padding:7px 11px;font-size:12px}
.btn[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
input[type=text],input[type=number],input[type=time],input[type=url],textarea,select{background:var(--input);color:var(--accent);font:500 15px/1.2 var(--f-mono);border:1px solid var(--line);border-radius:2px;padding:10px 12px;width:100%;min-width:0}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--bronze);box-shadow:0 0 0 3px color-mix(in srgb,var(--bronze) 20%,transparent)}
input::placeholder,textarea::placeholder{color:var(--label);font-weight:400;opacity:.6}
textarea{font-size:13px;font-weight:400;resize:vertical;line-height:1.5}
label.f,div.f{display:flex;flex-direction:column;gap:7px;font:500 10.5px/1.1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--label);min-width:0}
.f>span{font:inherit;letter-spacing:inherit}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.tag,.pill{display:inline-flex;align-items:center;gap:6px;font:500 11px/1 var(--f-mono);padding:5px 8px;border-radius:999px;letter-spacing:.04em;white-space:nowrap;background:color-mix(in srgb,currentColor 12%,transparent)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.VFR{color:var(--green)} .MVFR{color:var(--cyan)} .IFR{color:var(--red)} .LIFR{color:var(--magenta)}
.notice{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 16px;border:1px solid var(--line);border-left:3px solid var(--bronze);border-radius:4px;background:var(--panel);font-size:13.5px}
.notice b{color:var(--bronze);letter-spacing:.18em;font:500 10.5px/1 var(--f-ui);text-transform:uppercase}
.notice .btn{margin-left:auto}
.raw{font:400 13px/1.65 var(--f-mono);padding:14px 18px;background:var(--panel-2);border-bottom:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}
.mono-block{font:400 13.5px/1.75 var(--f-mono);overflow-wrap:anywhere}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:11px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font:500 10.5px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--label);background:var(--panel);position:sticky;top:0}
td{font-family:var(--f-mono);font-size:13px}
td.t{font-family:var(--f-ui);font-size:14px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.tot td{font-weight:600;background:var(--panel-2)}
tbody tr:hover td{background:color-mix(in srgb,var(--bronze) 7%,transparent)}
td input{width:92px;padding:6px 8px;text-align:right;font-size:13px}
.empty{padding:36px 24px;text-align:center;color:var(--label);font-size:14px}
.setrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);font-size:14.5px}
.setrow:last-child{border-bottom:0}
.setrow small{display:block;color:var(--label);font-size:12.5px;margin-top:2px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--red)}
.toast{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);z-index:8;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:3px;font:500 13px var(--f-ui);max-width:calc(100% - 32px);box-shadow:0 12px 30px -12px rgba(0,0,0,.45)}
svg text{font-family:var(--f-mono)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.disp{font-family:var(--f-disp);font-weight:400}

/* hero header inside an app (website hero/planner style) */
.hero{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:22px 24px}
.hero::before{content:"";position:absolute;inset:0;opacity:.5;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 79px,var(--grid) 79px 80px),repeating-linear-gradient(0deg,transparent 0 79px,var(--grid) 79px 80px)}
.hero>*{position:relative}
.hero .rose{position:absolute;right:-70px;top:50%;width:300px;height:300px;transform:translateY(-50%);opacity:.08;color:var(--brand)}
.hero h2{font:400 clamp(30px,4.2cqw,46px)/1.04 var(--f-disp);color:var(--accent-h);margin:10px 0 0}
.hero h2 em{font-style:normal;color:var(--bronze)}
.hero p{margin:8px 0 0;color:var(--label);font-size:14.5px;max-width:40em}
.route{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px;align-items:center;margin-top:14px}
.route .ap b{display:block;font:400 clamp(30px,4.4cqw,48px)/1 var(--f-disp);color:var(--ink)}
.route .ap span{display:block;margin-top:6px;font-size:13px;color:var(--label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.route .ap.r{text-align:right}
.route .mid{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--bronze);font:500 12px/1 var(--f-mono);min-width:110px}
.route .mid svg{width:100%;max-width:220px;height:22px}
.meter{height:8px;background:var(--panel-2);border-radius:999px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.meter i{display:block;height:100%;background:var(--brand);border-radius:999px}

/* Flight plan */
.ticket{margin:14px 18px 6px;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.ticket .th{background:var(--brand);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.ticket .th b{font:400 20px/1 var(--f-disp)}
.ticket .th span{font:500 11px/1 var(--f-mono);letter-spacing:.08em;color:var(--mist)}
.ticket .tb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:16px}
.ticket .tb b{display:block;font:400 26px/1 var(--f-disp)}
.ticket .tb small{display:block;font:500 11.5px/1.3 var(--f-mono);color:var(--label);margin-top:6px}
.ticket .tb .r{text-align:right}
.ticket .tb svg{width:34px;height:18px;color:var(--bronze)}
.ticket .tf{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px dashed var(--line);background:var(--panel-2)}
.ticket .tf div{padding:10px 14px;display:flex;flex-direction:column;gap:5px}
.ticket .tf span{font:500 9.5px/1 var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--label)}
.ticket .tf b{font:500 13px/1 var(--f-mono)}
.fuelbar{display:flex;height:34px;border-radius:3px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.fuelbar i{display:block;height:100%;min-width:2px}
.fuelkey{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:12.5px;color:var(--label)}
.fuelkey span{display:inline-flex;align-items:center;gap:7px}
.fuelkey i{width:11px;height:11px;border-radius:2px}
.wbar{display:grid;grid-template-columns:110px minmax(0,1fr) 120px;gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.wbar:last-child{border-bottom:0}
.wbar .k{font:500 13.5px var(--f-ui)}
.wbar .v{font:500 13px/1.3 var(--f-mono);text-align:right}
.wbar .v small{display:block;color:var(--label);font-size:11.5px}
.wtrack{position:relative;height:12px;border-radius:999px;background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--line)}
.wtrack i{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.wtrack b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.waypts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.waypts span{font:500 12.5px/1 var(--f-mono);padding:7px 9px;border:1px solid var(--line);border-radius:2px;background:var(--panel)}
.waypts span.aw{border:0;background:transparent;color:var(--bronze);padding:7px 2px}
.waypts span.ap{background:var(--brand);color:#fff;border-color:var(--brand)}
.oooi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
@container screen (max-width:560px){.oooi{grid-template-columns:repeat(2,minmax(0,1fr))}}
.oooi .oo{display:flex;flex-direction:column;gap:8px;padding:18px;box-shadow:inset -1px 0 0 var(--line),inset 0 -1px 0 var(--line);position:relative}
.oooi .oo.nx{background:color-mix(in srgb,var(--bronze) 8%,var(--panel))}
.oooi .oo .k{font:500 10.5px/1 var(--f-ui);letter-spacing:.16em;color:var(--label);text-transform:uppercase}
.oooi .oo .k b{display:block;font:400 22px/1 var(--f-disp);letter-spacing:0;text-transform:none;color:var(--ink);margin-bottom:6px}
.oooi .oo input{font-size:24px;padding:8px 10px;color:var(--label)}
.oooi .oo.set input{color:var(--green)}
.otl{display:flex;align-items:center;padding:20px 22px 4px}
.otl i{flex:1;height:2px;background:var(--line)}
.otl i.on{background:var(--brand)}
.otl b{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:var(--panel);flex:none}
.otl b.on{border-color:var(--brand);background:var(--brand)}
.otl b.nx{border-color:var(--bronze);box-shadow:0 0 0 4px color-mix(in srgb,var(--bronze) 22%,transparent)}
.stamp{width:100%;padding:18px;font-size:16px}
.stamp small{opacity:.8;font-size:13px}

/* Weather */
.wxhero{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:20px;align-items:center}
@container screen (max-width:900px){.wxhero{grid-template-columns:1fr}}
.wxhero .temp{font:400 64px/1 var(--f-disp);color:var(--ink);margin-top:12px}
.wxhero .temp small{font-size:20px;color:var(--label)}
.wxhero .cond{font:500 16px var(--f-ui);margin-top:6px}
svg.wind{width:100%;max-width:230px;display:block;margin:0 auto}
.w-ring{fill:none;stroke:var(--line)}.w-tick{stroke:var(--label)}.w-card{fill:var(--label);font:500 11px var(--f-ui)}
.w-rwy{fill:#4A5254}.w-rwyl{fill:#fff;font:600 10px var(--f-mono)}.w-arrow{fill:var(--bronze);stroke:var(--bronze);stroke-width:2}
.clouds{position:relative;height:150px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);margin:4px 8px 22px 46px}
.clouds .cl{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--label)}
.clouds .cl span{position:absolute;left:8px;top:-20px;font:500 11.5px var(--f-mono);color:var(--ink);background:var(--panel);padding:1px 6px}
.clouds .cl.ceil{border-top-color:var(--red)}
.clouds .ax{position:absolute;left:-44px;font:500 10px var(--f-mono);color:var(--label);transform:translateY(-50%)}
.taf{display:flex;flex-direction:column}
.taf div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;padding:11px 18px;border-bottom:1px solid var(--line);font:400 13px/1.5 var(--f-mono)}
.taf div:last-child{border-bottom:0}
.taf div b{font:500 11px/1.8 var(--f-ui);letter-spacing:.12em;color:var(--bronze);text-transform:uppercase}

/* Charts */
.chwrap{height:100%}
.chitem{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:10px 18px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;font:500 13px/1.3 var(--f-ui);color:var(--ink)}
.chitem:hover{background:var(--panel-2)}
.chitem[aria-pressed="true"]{background:color-mix(in srgb,var(--brand) 10%,var(--panel));color:var(--accent);box-shadow:inset 3px 0 0 var(--brand)}
.nn-cat{padding:16px 18px 6px;font:500 10.5px/1 var(--f-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--bronze);display:flex;justify-content:space-between}
.chpanel{display:flex;flex-direction:column;height:100%;min-height:0}
.chtool{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.chtool h3{font:400 19px/1.2 var(--f-disp);margin:0}
.chview{flex:1;min-height:0;overflow:auto;background:var(--panel-2);display:flex;justify-content:center;align-items:flex-start;padding:16px}
.chview canvas{display:block;box-shadow:0 10px 30px -12px var(--shadow),0 0 0 1px var(--line);background:#fff}
.chview.inv canvas{filter:invert(1) hue-rotate(180deg) brightness(.92)}
.chview.inv{background:#0b0b0b}
.chback{display:none}
.chempty{margin:auto;text-align:center;color:var(--label);max-width:340px}
.chempty svg{width:120px;height:120px;color:var(--brand);opacity:.18;display:block;margin:0 auto 12px}
.chempty h3{font:400 22px var(--f-disp);color:var(--ink);margin:0 0 6px}
@container screen (max-width:760px){.chwrap.has-sel .side{display:none}.chwrap:not(.has-sel) .chpanel{display:none}.chwrap .chpanel{height:calc(100cqh - var(--sbh) - 150px)}.chback{display:inline-flex}.chlist .side-x{display:block!important}}

/* Checklist */
.clhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.clprog{height:4px;background:color-mix(in srgb,#fff 25%,transparent)}
.clprog i{display:block;height:100%;background:var(--bronze-soft)}
.cl-item{display:flex;align-items:center;gap:14px;width:100%;padding:15px 20px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;font:500 14.5px/1.3 var(--f-ui);color:var(--ink)}
.cl-item:hover{background:var(--panel-2)}
.cl-item .box{width:22px;height:22px;border:1.5px solid var(--label);flex:none;display:grid;place-items:center;border-radius:50%}
.cl-item .lead{flex:1;min-width:14px;align-self:flex-end;margin-bottom:5px;border-bottom:1.5px dotted var(--line)}
.cl-item .resp{font:500 13.5px var(--f-mono);color:var(--cyan);text-align:right}
.cl-item.on .ch{color:var(--label);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--label) 50%,transparent)}
.cl-item.on .resp{color:var(--green)}
.cl-item.on .box{border-color:var(--green);background:var(--green)}
.cl-item.on .box::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.cl-div{padding:10px 20px 6px;font:500 10.5px/1 var(--f-ui);letter-spacing:.2em;color:var(--bronze);text-transform:uppercase;border-bottom:1px solid var(--line)}
.cl-if{padding:12px 20px 8px;color:var(--amber);font:500 13px var(--f-ui);border-bottom:1px solid var(--line)}
.cl-done{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;color:var(--green);font:500 14px var(--f-ui);background:color-mix(in srgb,var(--green) 8%,var(--panel))}
.ring{width:30px;height:30px;flex:none}
.ring circle{fill:none;stroke-width:3.5}
.ring .bg{stroke:var(--line)} .ring .fg{stroke:var(--brand);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ring.done .fg{stroke:var(--green)}
.mem{font:500 10px/1 var(--f-mono);border:1px solid currentColor;padding:3px 5px;border-radius:999px;color:var(--red)}
.nnlist .nt{font:500 13px/1.3 var(--f-ui)}
.lv{width:8px;height:8px;border-radius:50%;flex:none;margin:0 11px}
.lv.E{background:var(--red)} .lv.A{background:var(--amber)}

/* Calculators */
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px;align-items:start}
@container screen (max-width:820px){.calc{grid-template-columns:1fr}}
.big3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.big3>div{padding:18px 20px;box-shadow:inset -1px 0 0 var(--line)}
.big3>div:last-child{box-shadow:none}
.big3 span{display:block;font:500 10.5px/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--label)}
.big3 b{display:block;margin-top:10px;font:400 36px/1 var(--f-disp);color:var(--ink)}
.big3 b small{font:400 13px var(--f-ui);color:var(--label);margin-left:4px}
.stepper{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.stepper input{border:0;border-radius:0;text-align:center;font-size:20px;padding:10px 4px}
.stepper button{border:0;background:var(--panel-2);color:var(--accent);font:400 22px/1 var(--f-ui);cursor:pointer}
.stepper button:hover{background:color-mix(in srgb,var(--brand) 12%,var(--panel))}
svg.dprof,svg.xw{display:block;width:100%}
.dp-gnd{fill:color-mix(in srgb,var(--bronze) 16%,var(--panel))}.dp-path{fill:none;stroke:var(--brand);stroke-width:3}
.dp-lab{fill:var(--ink);font:500 12px var(--f-mono)}.dp-sub{fill:var(--label);font:500 10.5px var(--f-ui);letter-spacing:.1em}
.dp-dash{stroke:var(--label);stroke-dasharray:4 4}
.conv{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:center}
.conv .cside{border:1px solid var(--line);border-radius:4px;padding:16px 18px;background:var(--panel)}
.conv .cside span{font:500 10.5px/1 var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--bronze)}
.conv .cside input{border:0;padding:8px 0 0;font:400 40px/1.1 var(--f-disp);color:var(--ink);background:transparent}

/* ---------- Dynamic Island ---------- */
.isl-wrap{position:absolute;left:50%;top:calc(var(--sbh) + 9px);transform:translateX(-50%);z-index:30;display:flex;align-items:flex-start;gap:7px;font-family:var(--f-os);pointer-events:none}
.isl-wrap.in-safe{position:fixed;top:max(4px,calc(env(safe-area-inset-top,0px) / 2 - 18.5px))}
.isl-wrap>*{pointer-events:auto}
.isl{position:relative;width:236px;height:37px;border-radius:19px;background:#000;color:#fff;overflow:hidden;cursor:pointer;box-shadow:0 0 0 .5px rgba(255,255,255,.06),0 8px 22px -10px rgba(0,0,0,.6);transition:width .5s cubic-bezier(.32,1.3,.45,1),height .5s cubic-bezier(.32,1.3,.45,1),border-radius .5s cubic-bezier(.32,1.3,.45,1);-webkit-tap-highlight-color:transparent;outline:none}
.isl[data-k="music"]:not(.open),.isl[data-k="timer"]:not(.open),.isl[data-k="sw"]:not(.open){width:206px}
.isl[data-k="alert"]:not(.open){width:250px}
.isl:focus-visible{box-shadow:0 0 0 2px var(--bronze)}
.isl.open{width:min(392px,calc(100cqw - 16px));border-radius:30px}
.isl-c{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 13px 0 9px;transition:opacity .2s}
.isl.open .isl-c{opacity:0;pointer-events:none}
.isl-x{box-sizing:border-box;width:min(392px,calc(100cqw - 16px));padding:16px 18px 16px;opacity:0;transition:opacity .25s .12s;pointer-events:none}
.isl.open .isl-x{opacity:1;pointer-events:auto}
.isl:not(.open) .isl-x{position:absolute;visibility:hidden}
.isl-l,.isl-r{display:flex;align-items:center;gap:6px;min-width:0;font-size:13px;font-weight:600;white-space:nowrap}
.isl-l svg{width:21px;height:21px}
.isl-pl{width:17px!important;height:17px!important;color:#5CD2DD;transform:rotate(45deg)}
.isl-tl b{font-size:13px;letter-spacing:.02em}
.isl-or{color:#FF9F0A}
.isl-cv{width:24px;height:24px;border-radius:6px;overflow:hidden;display:block;flex:none}
.isl-cv svg,.isl-cv img{width:100%;height:100%;display:block;object-fit:cover}
.isl-ph{display:flex;align-items:center;gap:6px;font:600 12px var(--f-os);letter-spacing:.06em;color:#7EE2A8}
.isl-dot{width:7px;height:7px;border-radius:50%;background:#30D158;display:inline-block;animation:islp 1.6s infinite}
@keyframes islp{50%{opacity:.35}}
.isl-al{color:#9BE7C0;font-size:12.5px}
.isl .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.isl-bars{display:inline-flex;align-items:center;gap:2.5px;height:16px}

.isl-bars i:nth-child(2){animation-delay:-.25s}.isl-bars i:nth-child(3){animation-delay:-.5s}.isl-bars i:nth-child(4){animation-delay:-.7s}
@keyframes islb{0%,100%{height:5px}50%{height:16px}}
.isl-b{width:37px;height:37px;border-radius:50%;border:0;background:#000;color:#fff;display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 8px 22px -10px rgba(0,0,0,.6)}

.isl-b svg{width:17px;height:17px}

.isx-btn.gr{background:#30D158;color:#00210B}.isx-btn.or{background:#FF9F0A;color:#2A1600}.isx-btn.rd{background:#FF453A;color:#2A0300}
.isx-al,.isx-mu{display:flex;align-items:center;gap:12px}

/* phone without a hardware island: give the island its own row above the app bar */
@container screen (max-width:640px){

  .screen.isl-on .home .page{padding-top:62px}
  .isl{width:212px}.isl[data-k="music"]:not(.open),.isl[data-k="timer"]:not(.open),.isl[data-k="sw"]:not(.open){width:190px}
}

/* radar timeline */
.radarbar{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:30px;z-index:2;display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;background:var(--panel);border:1px solid var(--line);border-radius:4px;box-shadow:0 10px 28px -16px var(--shadow);font-family:var(--f-ui);width:250px}
.rb-play{width:38px;height:38px;border-radius:50%;border:0;background:var(--brand);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.rb-play svg{width:18px;height:18px;fill:currentColor}
.rb-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.rb-top{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:var(--label)}
.rb-top b{font:600 11.5px var(--f-mono);color:var(--ink);letter-spacing:.04em}
.rb-live{color:var(--green);font-weight:600}
.rb-dots{display:flex;gap:3px}
.rb-dots button{flex:1;height:6px;border:0;border-radius:2px;background:var(--line);cursor:pointer;padding:0}
.rb-dots button[aria-pressed="true"]{background:var(--brand)}
.rb-leg{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;font-size:9.5px;color:var(--label);letter-spacing:.06em;text-transform:uppercase}
.rb-leg i{height:5px;border-radius:3px;background:linear-gradient(90deg,#88DDEE,#0099CC,#0077AA,#FFEE00,#FFAA00,#FF4400,#C10000,#FF00FF)}
.rb-leg span:last-child{order:3}.rb-leg span:nth-child(2){order:-1}
@container screen (max-width:640px){.radarbar{top:104px;bottom:auto;left:8px;right:auto;width:min(250px,calc(100% - 76px))}}

.muw-t b{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* stronger icon labels over the light wallpaper */
.home .apps .lbl{text-shadow:0 1px 2px rgba(0,0,0,.55),0 0 10px rgba(0,0,0,.35)}

/* iPhone / iPad home-screen web app (see assist.js): the EFB is one fixed layer filling the
   viewport. --sat / --sab are the status-bar and home-indicator insets still inside that layer. */
html.pwa-ios{height:100%!important;overflow:hidden;padding:0!important}
html.pwa-ios body{position:fixed;inset:0;width:auto;height:auto;padding-top:var(--sat,0px);overflow:hidden}
html.pwa-ios body::before{height:var(--sat,0px)}
html.pwa-ios .home .dockwrap{padding-bottom:max(12px,calc(var(--sab,0px) - 12px))}
html.pwa-ios .appwin{padding-bottom:var(--sab,0px);background:linear-gradient(var(--bg),var(--bg)) top/100% calc(100% - var(--sab,0px)) no-repeat,var(--panel)}
/* pwa-chin: iOS keeps a strip below the page that shows only the page background. The dock sits
   right above it, and under a tab bar the strip takes the tab bar's colour so it reads as one bar. */
html.pwa-chin .home .dockwrap{padding-bottom:4px}
@media (max-width:640px){
  html.pwa-chin body:has(.screen.in-app .tabbar){background:var(--panel)}
  html.pwa-chin .tabbar{background:var(--panel)}
  html.pwa-chin body:has(.screen.in-app .clk){background:var(--ck-bg)}
}
/* inside the home-screen app the page already ends above the home indicator */
html.pwa-ios .maplayers{bottom:10px!important}

/* ---------- detail pass ---------- */
/* small buttons and the Performance toggles: readable and easy to hit (the compact Performance style used to leak out to every app) */
.appwin .btn.sm{padding:7px 11px;font-size:12px;min-height:32px}
.appwin .seg.tg button{padding:8px 13px;font-size:12px;min-height:34px;min-width:42px}
.cf a.sm{padding:9px 0}
@media (pointer:coarse){
  .appwin .btn.sm{min-height:36px}
  .mapapt .btn,.mapapt form .btn{min-height:36px!important;padding:6px 10px!important}
  .mapapt input{min-height:36px}
}
/* widgets: long titles wrap instead of being cut; the example tag has its own line */
.rem-t{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.2;flex:none}
.cal-ex{margin-top:auto;align-self:flex-start;font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--bronze);border:1px solid color-mix(in srgb,var(--bronze) 55%,transparent);border-radius:4px;padding:2px 5px}
.cal-ex+.cal-due{margin-top:5px}
/* Route: the three airports share the full width */
.stats.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
@container screen (max-width:640px){.stats.c3{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* tablets shown full screen: keep the island clear of the first row of the home screen */
@container screen (min-width:641px){.screen.isl-on .home{padding-top:calc(var(--sbh) + 50px)}}
@media (pointer:fine) and (min-width:1100px) and (min-height:760px){.screen.isl-on .home{padding-top:var(--sbh)}}
/* checklist widget: show whole items only (ones that don't fit drop off instead of being sliced) */

.rem-l li{width:100%}
/* tablets held upright: wider widget column so the widgets can hold their text */
@container screen (min-width:721px) and (max-aspect-ratio:1/1){.p1{grid-template-columns:min(400px,46cqw) minmax(0,1fr);gap:4cqw}}
/* chart overlay on the map */
.ovpanel,.ovbar{position:absolute;z-index:3;background:var(--panel);border:1px solid var(--line);border-radius:4px;box-shadow:0 10px 28px -16px var(--shadow);font-family:var(--f-ui)}
.ovpanel{left:max(12px,env(safe-area-inset-left,0px));top:110px;width:340px;max-height:calc(100% - 190px);display:flex;flex-direction:column;overflow:hidden}

.ovbar{right:calc(max(12px,env(safe-area-inset-right,0px)) + 56px);top:12px;width:372px;padding:10px 12px;display:grid;gap:8px}

}
/* No title bar in any app: the bar keeps only the app's own controls (Takeoff/Landing, Normal/Non-normal…),
   centred, and disappears when there are none. With a floating island it also keeps the island's row. */
.nav .nav-title,.nav .nav-r{display:none!important}
.nav{grid-template-columns:minmax(0,1fr)!important;justify-items:center;min-height:0!important;padding-block:8px!important;row-gap:0!important}
.nav .nav-tools{grid-column:1!important;grid-row:1!important;justify-self:center!important;max-width:100%;overflow-x:auto}
.screen.no-tools .nav{display:none}
.screen.isl-on.in-app .nav{display:grid;padding-top:54px!important}
.screen.isl-on.in-app.no-tools .nav{padding:46px 0 0!important;border-bottom:0;background:var(--bg)}
@container screen (max-width:640px){.screen.isl-on.in-app .nav{padding-top:52px!important}.screen.isl-on.in-app.no-tools .nav{padding-top:48px!important}}
/* desktop preview of the iPad frame: the island sits inside the status bar, so no extra row is needed */

.rw-l{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}.rw-l b{font:700 17px var(--f-mono);color:var(--ink)}.rw-l small{font:500 12px var(--f-ui);color:var(--label)}

.at-none .hw{color:var(--green);font-weight:700}.at-none .tw{color:var(--red);font-weight:700}
.as-tabs button{min-width:0}

.fc-t{border-collapse:separate;border-spacing:0;font:500 13px/1.25 var(--f-ui);color:var(--ink)}
.fc-t th{position:sticky;left:0;z-index:1;background:var(--panel);text-align:left;padding:8px 10px 8px 16px;font:600 11px/1.2 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--label);white-space:nowrap;border-right:1px solid var(--line)}

/* route edit: airways */
.re-awy{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}

.re-awyp{cursor:pointer}.re-awyp circle{fill:transparent}.re-awyp circle.d{fill:var(--panel);stroke:var(--accent);stroke-width:2}

.maplayers .btn{padding:7px 10px;font-size:10.5px}

.apt{fill:var(--panel);stroke:var(--ink);stroke-width:2}

const nmDist=(a,b)=>{if(a[0]==null||b[0]==null)return null;const r=Math.PI/180,dl=(b[0]-a[0])*r,dn=(b[1]-a[1])*r;const h=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)**2;return 2*3440.065*Math.asin(Math.sqrt(h))};

/* Work out which checklist the flight is at, from the vAMSYS phase text first, then from position, speed and altitude. */
function clPhase(f){const x=O(),p=String(f.phase||"").toLowerCase().replace(/[_-]+/g," ");
  const pos=[f.lat,f.lon],dDep=nmDist(pos,[N(x.o.pos_lat),N(x.o.pos_long)]),dArr=nmDist(pos,[N(x.d.pos_lat),N(x.d.pos_long)]);

  const remain=f.distanceRemaining!=null?f.distanceRemaining:dArr;const nearArr=(dArr!=null&&dArr<20)||(remain!=null&&remain<20&&(dDep==null||dDep>20));

    if(/board|pre ?flight|initiali|loading|gate|not started|ready/.test(p)&&!nearArr)return R("Before start","Boarding");
    if(/push/.test(p))return R("After start","Pushback & engine start");
    if(/taxi/.test(p))return /in/.test(p)||nearArr?R("After landing","Taxi in"):R("Taxi","Taxi out");
    if(/landed|roll ?out|after land/.test(p))return R("After landing","Landed");
    if(/final|landing|short final/.test(p))return R("Landing","Final approach");
    if(/descen|approach|star/.test(p))return R("Approach","Descent / approach");
    if(/take ?off|depart|climb|initial|airborne/.test(p))return R("After takeoff / climb","Takeoff & climb");

document.addEventListener("keydown",e=>{if(e.target.id!=="asIcao"||e.key!=="Enter")return;e.preventDefault();const v=e.target.value.trim().toUpperCase();if(!/^[A-Z0-9]{3,4}$/.test(v)){const first=[...document.querySelectorAll("#asSheet .as-apt")].find(b=>!b.hidden);if(first){first.click();return}toast("Enter an airport code like KLAX");return}

/* drag the sheet by its header on a phone: down to close, up to expand.
   Touch events with preventDefault, because iOS can cancel pointer events mid-drag; pointer events for a mouse. */
(function(){let st=null;
  const start=(t,y)=>{const el=$("#asSheet");if(!el||el.hidden||!t.closest||!t.closest(".as-head")||t.closest("button,input"))return false;
    if(el.offsetWidth<el.parentNode.offsetWidth-4)return false;st={y,dy:0,el,t0:Date.now()};el.style.transition="none";return true};
  const move=y=>{if(!st)return;st.dy=y-st.y;st.el.style.transform=st.dy>0?`translateY(${st.dy}px)`:st.dy<0&&!AS.full?`translateY(${Math.max(st.dy,-40)*.3}px)`:""};
  const end=tap=>{if(!st)return;const {el,dy,t0}=st;st=null;el.style.transition="";el.style.transform="";
    if(Math.abs(dy)<6){if(tap&&tap.closest&&tap.closest(".as-grab")){AS.full=!AS.full;asUi()}return}
    const fast=Date.now()-t0<250;
    if(dy>90||(fast&&dy>30)){if(AS.full&&dy<240&&!fast)AS.full=false;else AS.open=false}else if(dy<-40||(fast&&dy<-15))AS.full=true;asUi()};
  document.addEventListener("touchstart",e=>{if(e.touches.length!==1)return;start(e.target,e.touches[0].clientY)},{passive:true});
  document.addEventListener("touchmove",e=>{if(!st)return;e.preventDefault();move(e.touches[0].clientY)},{passive:false});
  document.addEventListener("touchend",e=>{if(st){e.preventDefault();end(e.target)}},{passive:false});
  document.addEventListener("touchcancel",()=>end(null));
  document.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse")return;start(e.target,e.clientY)});
  document.addEventListener("pointermove",e=>{if(e.pointerType==="mouse")move(e.clientY)});
  document.addEventListener("pointerup",e=>{if(e.pointerType==="mouse")end(e.target)})})();
/* typing in the airport search filters the list by code, city or name */

      <p class="mono">${atText(a.text)}</p><p class="at-note${old?" old":""}">${a.time?esc(a.time)+"Z":""}${m!=null?" · "+atAgoTxt(m):""}${old?" · may be out of date":""}</p></div>`});

/* Sun times for the airport sheet: civil twilight, sunrise and sunset (NOAA solar calculator equations, Meeus).
   Local time zone comes from the EFB server (by coordinates); without it the times show in UTC only. */
function sunPos(ms){const r=Math.PI/180,t=(ms/86400000+2440587.5-2451545)/36525;
  const L0=((280.46646+t*(36000.76983+t*0.0003032))%360+360)%360,M=357.52911+t*(35999.05029-0.0001537*t),e=0.016708634-t*(0.000042037+0.0000001267*t);
  const C=Math.sin(M*r)*(1.914602-t*(0.004817+0.000014*t))+Math.sin(2*M*r)*(0.019993-0.000101*t)+Math.sin(3*M*r)*0.000289;
  const om=125.04-1934.136*t,lam=L0+C-0.00569-0.00478*Math.sin(om*r);
  const eps=23+(26+(21.448-t*(46.815+t*(0.00059-t*0.001813)))/60)/60+0.00256*Math.cos(om*r);
  const dec=Math.asin(Math.sin(eps*r)*Math.sin(lam*r)),y=Math.tan(eps*r/2)**2;
  const eot=4/r*(y*Math.sin(2*L0*r)-2*e*Math.sin(M*r)+4*e*y*Math.sin(M*r)*Math.cos(2*L0*r)-0.5*y*y*Math.sin(4*L0*r)-1.25*e*e*Math.sin(2*M*r));
  return{dec,eot}}
/* times (ms UTC) for the given local calendar day; "up" or "down" when the sun never crosses that altitude */
function sunTimes(lat,lon,y,m,d){const r=Math.PI/180,day=Date.UTC(y,m-1,d);
  const ev=(h0,sign)=>{let t=day+(720-4*lon)*60000;for(let i=0;i<3;i++){const p=sunPos(t);const c=(Math.sin(h0*r)-Math.sin(lat*r)*Math.sin(p.dec))/(Math.cos(lat*r)*Math.cos(p.dec));
      if(c>1)return"down";if(c<-1)return"up";const ha=Math.acos(c)/r;t=day+(720-4*(lon+sign*ha)-p.eot)*60000}return Math.round(t)};
  return{dawn:ev(-6,1),rise:ev(-0.833,1),set:ev(-0.833,-1),dusk:ev(-6,-1)}}
const SUN={tz:{},loading:{},open:false};
function sunTzLoad(icao,lat,lon){if(!vam.url||SUN.tz[icao]!==undefined||SUN.loading[icao])return;SUN.loading[icao]=true;
  vamGet(`/api/efb/tz?lat=${lat}&lon=${lon}`,12000).then(j=>{SUN.tz[icao]=j&&j.tz||null}).catch(()=>{SUN.tz[icao]=null}).finally(()=>{SUN.loading[icao]=false;if(AS.open&&AS.icao===icao)asUi()})}
function sunYmd(ms,tz){try{const p=new Intl.DateTimeFormat("en-CA",{timeZone:tz||"UTC",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date(ms)).split("-");return p.map(Number)}catch(e){const d=new Date(ms);return[d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate()]}}

function sunFmt(v,tz,utcOnly){if(v==="up")return"Sun up all day";if(v==="down")return"Sun down all day";const t=Math.floor(v/60000)*60000,z=new Date(t).toISOString().slice(11,16).replace(":","")+"Z";
  if(!tz||utcOnly)return z;let l="";try{l=new Date(t).toLocaleTimeString("en-US",{timeZone:tz,hour:"numeric",minute:"2-digit",timeZoneName:"short"})}catch(e){return z}return{l,z}}
const sunCell=(v,tz)=>{const f=sunFmt(v,tz);return typeof f==="string"?f:`${esc(f.l)} <small>${f.z}</small>`};
const sunShort=(v,tz)=>{const f=sunFmt(v,tz);return typeof f==="string"?f:f.l.replace(/\s\S+$/,"")};
function asSun(icao){const a=(AS.data[icao]||{}).airport;if(!a||!isFinite(a.lat)||!isFinite(a.lon))return"";sunTzLoad(icao,a.lat,a.lon);
  const tz=SUN.tz[icao]||null,[y,m,d]=sunYmd(Date.now(),tz),s=sunTimes(a.lat,a.lon,y,m,d);

    +asRow("Morning civil twilight",sunCell(s.dawn,tz))+asRow("Sunrise",sunCell(s.rise,tz))+asRow("Sunset",sunCell(s.set,tz))+asRow("Evening civil twilight",sunCell(s.dusk,tz));
  h+=`<button class="as-more" data-assun aria-expanded="${SUN.open}"><span>${SUN.open?"Hide next 3 days":"Show next 3 days"}</span><i aria-hidden="true">›</i></button>`;
  if(SUN.open)for(let k=1;k<=3;k++){const dt=new Date(Date.UTC(y,m-1,d+k)),Y=dt.getUTCFullYear(),M=dt.getUTCMonth()+1,D=dt.getUTCDate(),q=sunTimes(a.lat,a.lon,Y,M,D);

  if(!tz&&!SUN.loading[icao]&&SUN.tz[icao]===null)h+=`<p class="at-none">Times in UTC. The local time zone couldn’t be found.</p>`;
  return h}
{const _ai=asInfo;asInfo=function(icao){const s=_ai(icao);const j=AS.data[icao];return j&&j.airport?s+asSun(icao):s}}
document.addEventListener("click",e=>{if(!e.target.closest("[data-assun]"))return;SUN.open=!SUN.open;asUi()});

/* Runways tab in the airport sheet: head/tail and crosswind for every runway end from the current METAR wind. */
function rwEnds(r,magE){const p=String(r.id||"").split("/").map(s=>s.trim()).filter(Boolean);if(!p.length)return[];
  const num=s=>{const m=s.match(/^(\d{1,2})/);return m?+m[1]:null};let t1=r.alignment!=null&&r.alignment!==""&&isFinite(+r.alignment)?+r.alignment:null;
  if(t1==null){const n=num(p[0]);if(n==null)return p.map(id=>({id,hdg:null}));t1=n*10+magE}
  const n0=num(p[0]),t2=(t1+180)%360;/* make sure the first id goes with the first heading */
  const ends=[{id:p[0],hdg:t1}];if(p[1])ends.push({id:p[1],hdg:t2});
  if(n0!=null&&p[1]){const m1=((t1-magE)%360+360)%360,diff=Math.abs(((n0*10-m1)%360+540)%360-180);if(diff>90){ends[0].hdg=t2;ends[1].hdg=t1}}
  return ends}
function rwComp(hdg,w){const a=(w.dir-hdg)*Math.PI/180;return{h:Math.cos(a),x:Math.sin(a)}}
const rwKt=(f,w)=>{const s=Math.round(Math.abs(f*w.spd)),g=w.gust?Math.round(Math.abs(f*w.gust)):null;return g!=null&&g!==s?s+"–"+g:String(s)};
const RW_AR={up:'<path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/>',down:'<path d="M8 3v10M3.5 8.5 8 13l4.5-4.5"/>',left:'<path d="M13 8H3M7.5 3.5 3 8l4.5 4.5"/>',right:'<path d="M3 8h10M8.5 3.5 13 8l-4.5 4.5"/>'};
const rwAr=(d,c)=>`<svg class="rw-ar ${c}" viewBox="0 0 16 16" aria-hidden="true">${RW_AR[d]}</svg>`;
function asRwy(icao){const j=AS.data[icao],a=j&&j.airport;
  if(!vam.url)return `<p class="as-empty">Set the EFB server in Settings to load runways.</p>`;
  if(AS.loading[icao]&&!j)return `<p class="as-empty">Loading ${esc(icao)}…</p>`;
  if(AS.err[icao]&&!j)return asErr(icao);
  const rw=a?a.runways.filter(r=>r.id&&!/^H\d/i.test(r.id)):[];if(!rw.length)return `<p class="as-empty">No runway data for ${esc(icao)}.</p>`;
  const md=String(a.magdec||"").match(/^(\d+)\s*([EW])$/i),magE=md?(+md[1])*(md[2].toUpperCase()==="E"?1:-1):0;
  const raw=j.metar&&j.metar.raw,dm=raw&&typeof decodeMetar==="function"?decodeMetar(raw):null,w=dm&&dm.wind;
  const tm=raw&&(raw.match(/\b\d{2}(\d{4})Z\b/)||[])[1];
  let head;
  if(!w)head=`<p class="rw-wind">${raw?"No wind in the METAR.":"No METAR, so no wind components."}</p>`;
  else if(w.spd===0)head=`<p class="rw-wind"><b>Calm</b>${tm?` <small>METAR ${tm}Z</small>`:""}</p>`;
  else head=`<p class="rw-wind">Wind <b>${w.dir==null?"Variable":String(w.dir).padStart(3,"0")+"°"} ${w.spd}${w.gust?"G"+w.gust:""} kt</b>${tm?` <small>METAR ${tm}Z · true</small>`:""}</p>`;
  const can=w&&w.dir!=null&&w.spd>0;let best=-1e9;const all=rw.map(r=>rwEnds(r,magE));
  if(can)all.forEach(es=>es.forEach(e=>{if(e.hdg!=null){e.c=rwComp(e.hdg,w);best=Math.max(best,e.c.h)}}));
  const cards=rw.map((r,i)=>{const es=all[i];
    const ends=es.map(e=>{const mh=e.hdg!=null?Math.round(((e.hdg-magE)%360+360)%360)||360:null;let comp="";
      if(can&&e.c){const h=e.c.h,x=e.c.x,hs=Math.round(Math.abs(h*w.spd)),xs=Math.round(Math.abs(x*w.spd));
        const xs_=xs||(w.gust&&Math.round(Math.abs(x*w.gust)))?`<span class="rw-c x">${rwAr(x>0?"left":"right","g")}${rwKt(x,w)} kt</span>`:`<span class="rw-c x">${rwAr(x>0?"left":"right","g")}0 kt</span>`;
        const hd=h>=0?`<span class="rw-c hw">${rwAr("down","hw")}${rwKt(h,w)} kt</span>`:`<span class="rw-c tw">${rwAr("up","tw")}${rwKt(h,w)} kt</span>`;
        comp=`<div class="rw-cs">${xs_}${hs||(w.gust&&Math.round(Math.abs(h*w.gust)))?hd:`<span class="rw-c">${rwAr("down","g")}0 kt</span>`}</div>`}
      else if(w&&w.spd>0&&w.dir==null)comp=`<div class="rw-cs"><span class="rw-c">Variable, up to ${w.gust||w.spd} kt</span></div>`;
      const isBest=can&&e.c&&e.c.h>0&&Math.abs(e.c.h-best)<1e-6;
      return `<div class="rw-end"><div class="rw-eh"><b>Rwy ${esc(e.id)}</b>${mh?`<small>${String(mh).padStart(3,"0")}°</small>`:""}${isBest?'<i class="rw-best">Best wind</i>':""}</div>${comp}</div>`}).join("");
    return `<div class="rw-card"><div class="rw-l"><b class="mono">${esc(r.id.replace("/"," – "))}</b><small>${r.lengthFt?fmt(r.lengthFt)+" × "+fmt(r.widthFt)+" ft":""}</small><small>${esc(AS_SURF[r.surface]||r.surface||"")}</small></div><div class="rw-r">${ends}</div></div>`}).join("");
  return head+`<div class="rw-list">${cards}</div><p class="at-none">Headwind <span class="hw">↓</span>, tailwind <span class="tw">↑</span>, crosswind ← →. Gusts shown as a range. Runway headings magnetic.</p>`}

function eaipFor(icao){icao=String(icao||"").toUpperCase();if(!/^[A-Z]{4}$/.test(icao))return null;if(/^(K|P[AHGFJKOMBW]|TJ|TI)/.test(icao))return null;if(/^Z[KM]/.test(icao))return null;

/* ---------- Weather app: hourly and 7-day forecast ----------

   is short by the status-bar height, fixed-position content is pinned to the top of the screen and
   is only drawn that far down, while normal-flow content may sit one status bar lower after a
   relaunch. So the whole EFB is pinned as one fixed layer, and the strip iOS keeps below it only
   ever shows the page background colour, which is matched to whatever sits at the bottom edge. */

      <div class="isx-st">${a.live?`<span>GS <b>${Math.round(f.groundspeed||0)}</b> KT</span><span>ALT <b>${f.altitude>=18000?"FL"+Math.round(f.altitude/100):fmt(f.altitude)}</b></span><span><b>${f.distanceRemaining!=null?fmt(f.distanceRemaining):"—"}</b> NM to go</span>`:`<span>ETE <b>${hhmm(N((ofp.times||{}).est_time_enroute))}</b></span><span><b>${fmt(a.total)}</b> NM</span><span>${Date.now()/1000<a.out?"Departs in <b>"+hhmm(Math.max(0,a.out-Date.now()/1000))+"</b>":"Arrives <b>"+utcHM(a.inn)+"</b>"}</span>`}</div>
      <div class="isx-btns">${due?`<button class="isx-btn gr" data-isl-go="checklist">${esc(due)} checklist</button>`:`<button class="isx-btn" data-isl-go="ofp">Flight plan</button>`}<button class="isx-btn" data-isl-go="map">Map</button></div></div>`}
  function bubble(a){if(!a)return "";if(a.k==="music")return `<span class="isl-cv">${muCover(muCur(),MU.idx)}</span>`;if(a.k==="flight")return PL;if(a.k==="timer"||a.k==="sw")return `<span class="isl-or mono" style="font-size:10px">${a.k==="timer"?cdFmt(cdLeft()).slice(-5):"SW"}</span>`;return ""}
  function place(){const inSafe=hw();wrap.classList.toggle("in-safe",inSafe);screenEl.classList.toggle("isl-on",!wrap.hidden&&!inSafe)}
  function update(){if(!islOn()){wrap.hidden=true;open=false;place();return}
    const L=acts();kinds=L.map(a=>a.k);const a=L[0];
    if(!a){wrap.hidden=true;open=false;pill.className="isl";place();return}
    wrap.hidden=false;pill.dataset.k=a.k;
    const c=compact(a);if(c!==lastC){cEl.innerHTML=c;lastC=c}
    if(open){const xh=expanded(a);if(xh!==lastX){xEl.innerHTML=xh;lastX=xh}}
    pill.classList.toggle("open",open);pill.setAttribute("aria-expanded",String(open));
    if(open)fitH();else pill.style.height="";
    const b=L[1];bub.hidden=!b||open;if(b)bub.innerHTML=bubble(b);bub.dataset.k=b?b.k:"";
    place()}
  function fitH(){if(open)pill.style.height=xEl.offsetHeight+"px"}
  if(window.ResizeObserver)new ResizeObserver(fitH).observe(xEl);
  function setOpen(v){open=v;if(v){lastX="";}update()}
  window.islAlert=function(o){alertA=Object.assign({k:"alert"},o);open=true;lastX="";update();clearTimeout(window.__islT);window.__islT=setTimeout(()=>{alertA=null;open=false;update()},o.ms||5500)};
  window.islUpdate=update;
  pill.addEventListener("click",e=>{if(e.target.closest("[data-isl-mu],[data-isl-cd],[data-isl-sw],[data-isl-go]"))return;const L=acts(),a=L[0];if(!a)return;
    if(a.k==="clock"){clockTab="world";try{store.set("clockTab","world")}catch(err){}goApp("timer");return}
    if(!open){setOpen(true);return}
    if(a.k==="alert"){const t=a.tap;alertA=null;open=false;update();if(t)t();return}
    const app={timer:"timer",sw:"timer",music:"music",flight:"map"}[a.k];open=false;update();if(app){if(a.k==="timer")clockTab="cd";if(a.k==="sw")clockTab="sw";goApp(app)}});
  pill.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pill.click()}if(e.key==="Escape")setOpen(false)});
  bub.addEventListener("click",()=>{if(bub.dataset.k){rot++;open=false;lastC="";update()}});
  wrap.addEventListener("pointerdown",e=>{const b=e.target.closest("[data-isl-mu],[data-isl-cd],[data-isl-sw],[data-isl-go]");if(!b)return;e.preventDefault();e.stopPropagation();
    if(b.dataset.islMu){const m=b.dataset.islMu;if(m==="play")muToggle();else muStep(m==="next"?1:-1)}
    if(b.dataset.islCd){if(b.dataset.islCd==="pause"){if(cd.end!=null){cd.remain=cdLeft();cd.end=null}else{cd.end=Date.now()+cd.remain*1000;cd.remain=null}}else cd={dur:cd.dur,end:null,remain:null};store.set("cd",cd);if(cur==="timer")render()}
    if(b.dataset.islSw){tmr.acc+=Date.now()-tmr.start;tmr.start=null;store.set("timer",tmr);if(cur==="timer")render()}
    if(b.dataset.islGo){open=false;if(b.dataset.islGo==="checklist"){try{if(CLP.idx!=null){clMode="normal";store.set("clMode","normal");clIdx=CLP.idx;store.set("clIdx",clIdx)}}catch(err){}}goApp(b.dataset.islGo)}
    setTimeout(update,30)});
  document.addEventListener("pointerdown",e=>{if(open&&!wrap.contains(e.target)){if(alertA){alertA=null}open=false;update()}},true);
  document.addEventListener("click",e=>{const t=e.target.closest("button");if(t&&t.dataset.island){store.set("island",t.dataset.island==="1");update();render()}});
  try{["play","pause","ended"].forEach(ev=>muA.addEventListener(ev,()=>update()))}catch(e){}
  setInterval(update,1000);window.addEventListener("resize",place);setTimeout(update,0);
})();

/* start */
(function(){const h=location.hash.slice(1);if(APPS[h]){cur=h;win.hidden=false;screenEl.classList.add("in-app");$("#home").inert=true;appChrome(h);root.style.setProperty("--sbg","var(--bar)")}else root.style.setProperty("--sbg","var(--wp0)");
  render();tick();setInterval(tick,1000)})();
})();
</script>
