name = "flight-trail"
main = "src/index.js"
compatibility_date = "2025-01-01"

# 每分鐘跑一次，記錄你在線上時的位置
[triggers]
crons = ["* * * * *"]

# 綁在你自己的網域（網域已在 Cloudflare，部署時會自動建立 DNS 紀錄）
# 注意：trail.koz8738.com 這個名稱底下不能已經有別的 DNS 紀錄
routes = [
  { pattern = "trail.koz8738.com", custom_domain = true }
]

[vars]
VATSIM_CID = "1931319"
# 允許讀取軌跡的網站（改成你自己的網址）
ALLOWED_ORIGINS = "https://koz8738.com,https://www.koz8738.com"

# 先執行 `npx wrangler kv namespace create TRAIL`，把印出來的 id 貼到下面
[[kv_namespaces]]
binding = "TRAIL"
id = "把這裡換成 kv namespace 的 id"
