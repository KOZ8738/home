name = "flight-trail"
main = "src/index.js"
compatibility_date = "2025-01-01"

# 綁在你自己的網域（網域已在 Cloudflare，部署時會自動建立 DNS 紀錄）
# 注意：1. 這個設定必須放在所有 [區段] 之前，不然會被當成區段裡的欄位而失效
#       2. trail.koz8738.com 這個名稱底下不能已經有別的 DNS 紀錄
routes = [
  { pattern = "trail.koz8738.com", custom_domain = true }
]

# 關掉預設的 flight-trail.<你的帳號名稱>.workers.dev 網址，只留自己的網域
# （那個網址裡有你的 Cloudflare 帳號名稱）
workers_dev = false

# 每分鐘跑一次，記錄你在線上時的位置
[triggers]
crons = ["* * * * *"]

# 下面的 VATSIM_CID、ALLOWED_ORIGINS 和上面 routes 的網域，是從根目錄的 site-config.json 抄過來的
# （Cloudflare 只看這個資料夾，讀不到根目錄）。要改請改 site-config.json，再執行 node scripts/sync-shared.mjs
[vars]
VATSIM_CID = "1931319"
# 允許讀取軌跡的網站
ALLOWED_ORIGINS = "https://koz8738.com,https://www.koz8738.com"

# KV 已經建好（名稱 flight-trail-TRAIL）
[[kv_namespaces]]
binding = "TRAIL"
id = "03f3687d6f1644ecb2feb6113f778699"
