# Polaris EFB 的資料伺服器（暫時放在 koz8738.com）
# name 必須和 Cloudflare 後台的 Worker 名稱一樣
name = "polaris-efb-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

# 綁自己的網域；Cloudflare 會自動建 DNS 和憑證
routes = [
  { pattern = "efb-api.koz8738.com", custom_domain = true }
]

# 關掉預設的 polaris-efb-api.<帳號名稱>.workers.dev 網址（那個網址裡有你的 Cloudflare 帳號名稱）
workers_dev = false

# 永久存放機場滑行圖和航圖清單（Workers KV）
[[kv_namespaces]]
binding = "STORE"
id = "f07c7d20558c4ecf84df98ddb5ea235a"

# AIP Japan charts uploaded on /admin › Nav Data (src/jpcharts.js); private, read only through the Worker
[[r2_buckets]]
binding = "CHARTS"
bucket_name = "polaris-efb-charts"

# 每 20 分鐘檢查一次美國大型機場的資料，缺的或超過 25 天的才重抓（每次最多 3 座）
# Durable Objects, each with its own SQLite database. Both work on the Workers Free plan; wrangler creates them on deploy.
#   PM   pilots' messages to a department or an online flight (src/pm.js)
#   CREW check-in, briefing notifications, Web Push and flown tracks (src/crew.js)
#   KB   each pilot's kneeboard pages, synced between their devices; only the pilot can read them (src/kb.js)
[[durable_objects.bindings]]
name = "PM"
class_name = "Mailbox"

[[durable_objects.bindings]]
name = "CREW"
class_name = "Crew"

[[durable_objects.bindings]]
name = "KB"
class_name = "Kneeboard"

# PFD  the backup PFD relay: the simulator PC's attitude and speeds to the pilot's iPad, one per pilot (src/pfd.js)
[[durable_objects.bindings]]
name = "PFD"
class_name = "PfdRelay"

# TASKS staff tasks in the Operations admin, published to a department (src/tasks.js)
[[durable_objects.bindings]]
name = "TASKS"
class_name = "Taskboard"

# EMAIL  the AIRAC reminder emails to the staff who may update Nav Data (src/airacmail.js), Cloudflare Email Service.
#        Sent from MAIL_FROM below. One-time setup in Cloudflare: koz8738.com › Email › Email Routing turned on, and, on the
#        Workers Free plan, each staff address added and verified under Destination addresses (the binding can send
#        only to verified addresses there; on Workers Paid with Email Sending, to anyone).
[[send_email]]
name = "EMAIL"

[[migrations]]
tag = "pm-v1"
new_sqlite_classes = ["Mailbox"]

[[migrations]]
tag = "crew-v1"
new_sqlite_classes = ["Crew"]

[[migrations]]
tag = "kb-v1"
new_sqlite_classes = ["Kneeboard"]

[[migrations]]
tag = "pfd-v1"
new_sqlite_classes = ["PfdRelay"]

[[migrations]]
tag = "tasks-v1"
new_sqlite_classes = ["Taskboard"]

[triggers]
crons = ["*/20 * * * *", "*/2 * * * *"]   # */2: automatic stand assignment (src/stands.js)

[vars]
# the sender of the AIRAC reminder emails (src/airacmail.js); must be on a domain set up for email in Cloudflare
MAIL_FROM = "noreply@koz8738.com"
# EFB 只需要唯讀權限
VAMSYS_SCOPE = "ops:read"
# 只有這些網站的網頁可以讀這個 Worker
ALLOWED_ORIGINS = "https://koz8738.com,https://www.koz8738.com"
# Polaris Mail admin (https://efb-api.koz8738.com/admin), protected by Cloudflare Access.
# Fill these two from Zero Trust → Access → Applications → (the admin application). They are not secret.
#   ACCESS_TEAM_DOMAIN: your team domain, e.g. "polaris.cloudflareaccess.com"
#   ACCESS_AUD: the application's "Application Audience (AUD) Tag"
# While either is empty the admin stays locked.
ACCESS_TEAM_DOMAIN = "frosty-boat-dd9f.cloudflareaccess.com"
ACCESS_AUD = "613d19b5e1e81f090b711342d78daaca962586787804d832cfedd597a1228e4b"
# Pilot sign-in to the EFB ("Login with vAMSYS"): the Pilot API client in Orwell > API (Authorization Code + PKCE).
# Its Client ID is not secret. Redirect URL registered there: https://efb-api.koz8738.com/auth/callback
VAMSYS_PILOT_CLIENT_ID = "1388"
# Where a pilot lands after signing in, if the EFB did not say
EFB_URL = "https://koz8738.com/efb/"

# vAMSYS 金鑰不要寫在這裡（這個檔案會上 GitHub）。
# 在 Cloudflare 後台 → 這個 Worker → Settings → Variables and Secrets 新增，類型選 Secret：
#   VAMSYS_CLIENT_ID
#   VAMSYS_CLIENT_SECRET
